name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev)
        run: python -m pip install -e ".[dev]"
      - name: Byte-compile
        run: python -m compileall pwnscout
      - name: Tests
        run: python -m pytest -q
      - name: Smoke (kb + help + zero-dep import)
        run: |
          python -c "import pwnscout; print(pwnscout.__version__)"
          python pwnscout.py kb
          python pwnscout.py --help
