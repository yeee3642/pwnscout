[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pwnscout"
version = "0.1.0"
description = "Offline attack-surface & exploitability scanner. No AI, no cloud — run it and know what you can hit."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "pwnscout contributors" }]
keywords = ["pentest", "recon", "ctf", "attack-defense", "scanner", "offline", "red-team"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []  # standard library only — that is the point

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ericchen913900/pwnscout"
Issues = "https://github.com/ericchen913900/pwnscout/issues"

[project.scripts]
pwnscout = "pwnscout.cli:main"

[tool.setuptools]
packages = [
    "pwnscout",
    "pwnscout.core",
    "pwnscout.scan",
    "pwnscout.enum",
    "pwnscout.kb",
    "pwnscout.verify",
    "pwnscout.exploit",
    "pwnscout.web",
    "pwnscout.report",
]

[tool.setuptools.package-data]
"pwnscout.kb" = ["*.json", "*.txt"]
